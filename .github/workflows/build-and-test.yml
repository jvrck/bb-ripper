name: Build and Test Workflow

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Locked package regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify and sync the lock
        run: |
          uv lock --check
          uv sync --locked
      - name: Run regression tests
        run: uv run --locked python -m unittest discover -v
      - name: Lint
        run: uv run --locked pylint src/bb_ripper bb-ripper scripts
      - name: Verify generated pip fallback
        run: |
          scripts/export_requirements.sh /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
      - name: Audit runtime dependencies
        run: uv run --locked pip-audit -r requirements.txt
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify clean wheel and source installs
        shell: bash
        run: |
          set -euo pipefail
          assert_fail_closed() {
            local output status
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            grep -q "Missing required environment variables" <<< "$output"
          }

          for artifact in dist/*.whl dist/*.tar.gz; do
            environment="$(mktemp -d)"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install -r requirements.txt
            "$environment/bin/python" -m pip install --no-deps "$artifact"
            assert_fail_closed "$environment/bin/bb-ripper"
            assert_fail_closed "$environment/bin/python" -m bb_ripper
            rm -rf "$environment"
          done

  pip-fallback:
    name: Pip and legacy source compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install generated runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: PYTHONPATH=src python -m unittest discover -v
      - name: Verify legacy source launchers
        shell: bash
        run: |
          set -euo pipefail
          assert_fail_closed() {
            local output status
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            test "$status" -eq 1
            grep -q "Missing required environment variables" <<< "$output"
          }

          assert_fail_closed python3 bb-ripper/
          cd bb-ripper
          assert_fail_closed python3 .
