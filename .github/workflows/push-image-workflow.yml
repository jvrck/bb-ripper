name: Push Image Workflow

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    tags:
      - "*"
    branches:
      - "release-*"
      - "*-release"
      - "release/*"
      - "master"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build and optionally publish (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: standard
            awscli: "FALSE"
          - variant: aws
            awscli: "TRUE"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive event-specific image tags
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 scripts/image_metadata.py \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --variant "${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.metadata.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Packages
        if: steps.metadata.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          build-args: AWSCLI=${{ matrix.awscli }}
          push: ${{ steps.metadata.outputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
