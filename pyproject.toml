[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[project]
name = "bb-ripper"
version = "1.3.0"
description = "Back up every repository and branch in a Bitbucket workspace"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jim Vrckovski", email = "jim.vrckovski@gmail.com" },
]
dependencies = [
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/jvrck/bb-ripper"
Repository = "https://github.com/jvrck/bb-ripper"
Issues = "https://github.com/jvrck/bb-ripper/issues"

[project.scripts]
bb-ripper = "bb_ripper.__main__:main"

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pylint==4.1.3",
]

[tool.uv]
package = true
